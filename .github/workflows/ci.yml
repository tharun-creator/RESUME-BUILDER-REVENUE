# CI pipeline — lint, typecheck, test, dependency audit, secret scan, build.
# Owner: Security/DevOps agent (task T-S1). Source of truth: docs/PRD.md.
#
# Runs on every pull request and on pushes to main. Deploy is intentionally
# NOT part of this workflow — deployment happens only after a human merges the
# PR and the manager signs off (release order: docs/AGENTS.md §10).
#
# Dependency on task T-R1 (root scaffold): the scripts `lint`, `typecheck` and
# `test` are expected to exist in the root package.json, and `build` is
# assumed to exist as well — all verified in wave 2.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (full history for the secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Dependency audit (fail on high/critical advisories)
        run: npm audit --audit-level=high

      - name: Secret scan (gitleaks — never prints found secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

      - name: Build
        run: npm run build

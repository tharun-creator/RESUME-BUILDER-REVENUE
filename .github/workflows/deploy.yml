name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-images:
    name: Build & push Docker images (GHCR)
    runs-on: ubuntu-latest
    if: github.repository_owner != ''
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image owner
        id: img
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ghcr.io/${{ steps.img.outputs.owner }}/resume-builder-api:latest,ghcr.io/${{ steps.img.outputs.owner }}/resume-builder-api:${{ github.sha }}

      - name: Build and push Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.worker
          push: true
          tags: ghcr.io/${{ steps.img.outputs.owner }}/resume-builder-worker:latest,ghcr.io/${{ steps.img.outputs.owner }}/resume-builder-worker:${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ghcr.io/${{ steps.img.outputs.owner }}/resume-builder-web:latest,ghcr.io/${{ steps.img.outputs.owner }}/resume-builder-web:${{ github.sha }}

  render-deploy-hooks:
    name: Trigger Render deploy hooks (optional)
    runs-on: ubuntu-latest
    needs: build-and-push-images
    env:
      RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
      RENDER_WORKER_DEPLOY_HOOK: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK }}
      RENDER_WEB_DEPLOY_HOOK: ${{ secrets.RENDER_WEB_DEPLOY_HOOK }}
    steps:
      - name: Trigger API hook
        if: ${{ env.RENDER_API_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "$RENDER_API_DEPLOY_HOOK"
      - name: Trigger Worker hook
        if: ${{ env.RENDER_WORKER_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "$RENDER_WORKER_DEPLOY_HOOK"
      - name: Trigger Web hook
        if: ${{ env.RENDER_WEB_DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "$RENDER_WEB_DEPLOY_HOOK"
